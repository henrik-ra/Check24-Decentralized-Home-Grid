services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 2s
      retries: 10

  home-core:
    build: ../services/home-core
    environment:
      REDIS_URL: redis://redis:6379
      INGEST_KEY_TRAVEL: dev-secret-123
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_READ_TIMEOUT_MS: "40"
      LKG_TTL_MS: "300000"
      LKG_MAX_ENTRIES: "5000"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  speedboat-travel:
    build: ../services/speedboat-travel
    environment:
      CORE_URL: http://home-core:3000
      PRODUCT_ID: travel
      INGEST_API_KEY: dev-secret-123
      USER_IDS: demo@example.com
    depends_on:
      - home-core
    restart: unless-stopped
